kind = "web"
previewPath = "/"
title = "0docs"
version = "1.0.0"
id = "artifacts/zdocs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25883

[services.development]
run = "pnpm --filter @workspace/zdocs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zdocs", "run", "build" ]
publicDir = "artifacts/zdocs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25883"
BASE_PATH = "/"
