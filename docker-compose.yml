# 0docs self-hosted stack.
#
# Two ways to use this file:
#
#   1. `docker compose up postgres` — just run Postgres, then run the
#      Node app on your host with `pnpm install && pnpm run dev`.
#      Best for active development.
#
#   2. `docker compose up` — run the full stack (Postgres + app) in
#      containers. The app image serves both the API and the built
#      frontend on PORT (default 8081). No host Node install required.
#
# All settings come from `.env`. Run `./install.sh` first to generate it,
# or copy `.env.example` to `.env` yourself.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zerodocs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zerodocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zerodocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-zerodocs}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NODE_ENV: production
      PORT: 8081
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    ports:
      - "${PORT:-8081}:8081"

volumes:
  zerodocs_pgdata:
